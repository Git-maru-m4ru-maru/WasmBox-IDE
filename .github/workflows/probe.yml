name: Probe v86 networking (temporary)

on:
  push:
    paths:
      - "tools/probe-v86.mjs"
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false v86@0.5
      - run: node tools/probe-v86.mjs
      - name: List the v86-buildroot release and look for the kernel config
        run: |
          curl -fL https://github.com/chschnell/v86-buildroot/releases/download/v1.0.2/v86-buildroot-1.0.2.tar.bz2 -o /tmp/br.tar.bz2
          tar -tjvf /tmp/br.tar.bz2 > /tmp/br.list
          echo "::notice title=probe buildroot files::$(sed 's/%/%25/g' /tmp/br.list | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
          mkdir -p /tmp/br && tar -xjf /tmp/br.tar.bz2 -C /tmp/br --wildcards '*config*' '*.config' 2>/dev/null || true
          found=$(find /tmp/br -type f | head -20)
          echo "::notice title=probe buildroot config files::$(echo "$found" | sed ':a;N;$!ba;s/\n/%0A/g')"
          for f in $found; do
            echo "::notice title=probe config $(basename "$f")::$(grep -E 'CONFIG_(NE2K|8390|NE2000|VIRTIO|VIRTIO_NET|NET_VENDOR|E100|PCNET|INET|PACKET|NETDEVICES|ETHERNET)[A-Z0-9_]*=' "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
