name: Probe relay filter (temporary)

on:
  push:
    paths:
      - "tools/probe-relay-filter.mjs"
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false @mercuryworkshop/wisp-js@0.5.0
      - run: node tools/probe-relay-filter.mjs
