name: Probe v86 networking (temporary)

on:
  push:
    paths:
      - "tools/probe-v86.mjs"
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false v86@0.5
      - run: node tools/probe-v86.mjs
      - name: List the v86-buildroot release and look for the kernel config
        run: |
          curl -fL https://github.com/chschnell/v86-buildroot/releases/download/v1.0.2/v86-buildroot-1.0.2.tar.bz2 -o /tmp/br.tar.bz2
          tar -tjvf /tmp/br.tar.bz2 > /tmp/br.list
          echo "::notice title=probe buildroot files::$(sed 's/%/%25/g' /tmp/br.list | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
          mkdir -p /tmp/br && tar -xjf /tmp/br.tar.bz2 -C /tmp/br --wildcards '*config*' '*.config' 2>/dev/null || true
          found=$(find /tmp/br -type f | head -20)
          echo "::notice title=probe buildroot config files::$(echo "$found" | sed ':a;N;$!ba;s/\n/%0A/g')"
          for f in $found; do
            echo "::notice title=probe config $(basename "$f")::$(grep -E 'CONFIG_(NE2K|8390|NE2000|VIRTIO|VIRTIO_NET|NET_VENDOR|E100|PCNET|INET|PACKET|NETDEVICES|ETHERNET)[A-Z0-9_]*=' "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
      - name: Look up WISP server packages on npm
        run: |
          for pkg in wisp-server-node @mercuryworkshop/wisp-js wisp-js wisp-server-python; do
            out=$(npm view "$pkg" name version description bin repository.url dist.unpackedSize 2>&1 | head -12 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=probe npm $pkg::$out"
          done
      - name: Read the README and bin of the most likely server package
        run: |
          mkdir -p /tmp/wisp && cd /tmp/wisp && npm init -y >/dev/null
          npm install --no-audit --no-fund @mercuryworkshop/wisp-js wisp-server-node 2>&1 | tail -3 || true
          for pkg in @mercuryworkshop/wisp-js wisp-server-node; do
            d=node_modules/$pkg
            [ -d "$d" ] || { echo "::notice title=probe $pkg::not installed"; continue; }
            echo "::notice title=probe $pkg package.json::$(jq -c '{name,version,bin,main,exports,type,engines,dependencies}' "$d/package.json" | sed 's/%/%25/g')"
            [ -f "$d/README.md" ] && echo "::notice title=probe $pkg README::$(head -c 5000 "$d/README.md" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::notice title=probe $pkg files::$(find "$d" -maxdepth 2 -not -path '*/node_modules/*' | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
      - name: Read wisp-js server options (names and defaults)
        run: |
          cd /tmp/wisp
          d=node_modules/@mercuryworkshop/wisp-js
          echo "::notice title=probe wisp-js server files::$(find $d/src/server $d/src/bin -type f | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=probe wisp-js option names::$(grep -rhoE 'allow_[a-z_]+|[a-z_]*(blacklist|whitelist)[a-z_]*|dns_[a-z_]+|port_[a-z_]+|hostname_[a-z_]+' $d/src | sort | uniq -c | sort -rn | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
          f=$(grep -rlE 'allow_private_ips|allow_loopback_ips|allow_[a-z_]*ips' $d/src | head -3)
          echo "::notice title=probe wisp-js option files::$(echo "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
          for x in $f; do
            echo "::notice title=probe wisp-js $(basename $x)::$(grep -nE 'allow_|blacklist|whitelist|options|default' $x | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          timeout 20 npx wisp-js-server --help 2>&1 | head -3 || true
