<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WasmBox IDE</title>
<meta name="description" content="ブラウザ内のLinuxでPythonとNode.jsを実行するIDE">
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: dark;
  --chrome: #181818;
  --sidebar: #181818;
  --surface: #1f1f1f;
  --editor: #1e1e1e;
  --panel: #181818;
  --ink: #d4d4d4;
  --muted: #9da0a6;
  --faint: #727780;
  --line: #303033;
  --line-strong: #414144;
  --accent: #3794ff;
  --accent-soft: #264f78;
  --selection: #264f78;
  --mono: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body { display: flex; flex-direction: column; overflow: hidden; background: var(--editor); color: var(--ink); font: 13px/1.45 var(--sans); }
button, input, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
[hidden] { display: none !important; }

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  flex: 0 0 42px; min-width: 0; padding: 0 12px 0 15px;
  background: var(--chrome); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand-name { font-size: 13px; font-weight: 600; letter-spacing: .01em; }
.brand-separator { color: var(--faint); }
.brand-context { color: var(--muted); font-size: 12px; }
.actions { display: flex; align-items: center; justify-content: flex-end; gap: 5px; min-width: 0; }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 28px; padding: 4px 10px; border: 1px solid transparent;
  border-radius: 3px; background: transparent; color: var(--ink);
  font-size: 12px; white-space: nowrap;
}
.button:hover:not(:disabled) { background: #2a2d2e; }
.button.primary { min-width: 76px; background: #0e639c; color: #fff; }
.button.primary:hover:not(:disabled) { background: #1177bb; }
.button.danger { color: #f48771; }
.button.danger:hover:not(:disabled) { background: #492b2b; }
.button.quiet { border-color: var(--line-strong); }
.run-glyph { color: #fff; font-size: 10px; }
.project-menu { position: relative; }
.project-menu summary {
  display: grid; place-items: center; width: 29px; height: 28px; border-radius: 3px;
  color: var(--muted); list-style: none; cursor: pointer; font-size: 18px; line-height: 1;
}
.project-menu summary::-webkit-details-marker { display: none; }
.project-menu summary:hover, .project-menu[open] summary { background: #2a2d2e; color: var(--ink); }
.project-menu-panel {
  position: absolute; z-index: 20; top: 33px; right: 0; width: 190px; padding: 4px;
  background: #252526; border: 1px solid var(--line-strong); box-shadow: 0 8px 18px #0005;
}
.menu-item { display: block; width: 100%; padding: 7px 9px; border: 0; border-radius: 2px; background: transparent; text-align: left; color: var(--ink); font-size: 12px; }
.menu-item:hover { background: #2a2d2e; }
.workspace { display: grid; grid-template-columns: 232px minmax(0, 1fr); flex: 1; min-height: 0; }
.sidebar { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--sidebar); border-right: 1px solid var(--line); }
.sidebar-heading {
  display: flex; align-items: center; justify-content: space-between; min-height: 35px; padding: 0 10px 0 18px;
  color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .045em; text-transform: uppercase;
}
.icon-button { display: grid; place-items: center; width: 25px; height: 25px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 18px; }
.icon-button:hover { background: #2a2d2e; color: var(--ink); }
.project-heading { display: flex; align-items: center; gap: 6px; min-height: 29px; padding: 0 12px; color: var(--ink); font-size: 11px; font-weight: 600; letter-spacing: .035em; }
.project-caret { color: var(--muted); font-size: 10px; }
#file-tree { overflow: auto; padding: 1px 0 8px; }
.file-row {
  display: flex; align-items: center; gap: 7px; width: 100%; min-height: 27px; padding: 3px 10px 3px 17px;
  border: 0; border-radius: 0; border-left: 2px solid transparent; background: transparent;
  color: #c5c5c5; text-align: left; font-size: 12px;
}
.file-row:hover { background: #242526; }
.file-row.active { border-left-color: var(--accent); background: #252526; color: #fff; }
.file-type-icon { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 20px; width: 20px; color: #c5c5c5; font: 600 9px/1 var(--mono); }
.file-type-icon.python { color: #75beff; }
.file-type-icon.javascript { color: #e6c875; }
.file-type-icon.shell { color: #89d185; }
.file-type-icon.json { color: #dcb67a; }
.file-type-icon.html { color: #e69a76; }
.file-type-icon.css { color: #c6a0f6; }
.file-type-icon.markdown { color: #9da0a6; }
.file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#new-file-form { display: grid; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); }
#new-file-name { width: 100%; min-width: 0; padding: 6px 7px; border: 1px solid var(--line-strong); border-radius: 2px; background: #202020; color: var(--ink); font: 12px var(--mono); }
.new-file-actions { display: flex; gap: 5px; }
.new-file-actions button { flex: 1; }
#new-file-error { color: #f48771; font-size: 11px; }

.editor-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--editor); }
.editor-tabbar {
  display: flex; align-items: stretch; min-height: 35px; overflow: hidden;
  background: #181818; border-bottom: 1px solid var(--line);
}
.open-tabs { display: flex; align-items: stretch; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.open-tabs::-webkit-scrollbar { display: none; }
.editor-tab { display: flex; flex: 0 0 auto; align-items: stretch; max-width: 250px; min-width: 0; border-right: 1px solid var(--line); background: #181818; }
.editor-tab.active { border-top: 1px solid var(--accent); background: var(--editor); }
.editor-tab-main { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 0 5px 0 12px; border: 0; background: transparent; color: var(--muted); font-size: 12px; text-align: left; }
.editor-tab-main:hover { color: var(--ink); }
.editor-tab.active .editor-tab-main { color: #fff; }
.editor-tab-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor-tab-close { display: grid; place-items: center; align-self: center; flex: 0 0 20px; width: 20px; height: 20px; margin: 0 4px; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 15px; line-height: 1; visibility: hidden; }
.editor-tab:hover .editor-tab-close, .editor-tab.active .editor-tab-close, .editor-tab-close:focus-visible { visibility: visible; }
.editor-tab-close:hover { background: #3a3d41; color: #fff; }
#project-save-label { color: var(--muted); font-size: 10px; }
#project-save-label[data-save=saved] { color: #89d185; }
#project-save-label[data-save=pending] { color: #e6c875; }
#project-save-label[data-save=error] { color: #f48771; }
.editor-tab-spacer { flex: 1; min-width: 0; }
.editor-toolbar { display: flex; align-items: center; gap: 4px; padding: 0 8px; color: var(--muted); font-size: 11px; }
.editor-body { display: grid; grid-template-columns: 48px minmax(0, 1fr); flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: var(--editor); }
#line-numbers {
  margin: 0; padding: 12px 10px 24px 0; overflow: hidden; border-right: 1px solid #292929;
  background: var(--editor); color: #858585; text-align: right; white-space: pre; user-select: none;
  font: 13px/21px var(--mono);
}
.editor-surface { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#code-editor {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; min-width: 0; min-height: 0;
  resize: none; padding: 12px 16px 28px; border: 0; outline: none; background: var(--editor); color: var(--ink);
  tab-size: 2; white-space: pre; overflow: auto; font: 13px/21px var(--mono);
}
.cm-host { position: absolute; inset: 0; display: none; min-width: 0; min-height: 0; overflow: hidden; background: var(--editor); }
.cm-host .cm-editor { height: 100%; font-size: 13px; color: var(--ink); background: var(--editor); }
.cm-host .cm-scroller { overflow: auto; font-family: var(--mono); line-height: 21px; }
.editor-body.cm-ready #line-numbers, .editor-body.cm-ready #code-editor { display: none; }
.editor-body.cm-ready .cm-host { display: block; }
.output-panel { display: flex; flex: 0 0 auto; flex-direction: column; height: 188px; max-height: 34vh; min-height: 92px; border-top: 1px solid var(--line-strong); background: var(--panel); }
.output-heading { display: flex; align-items: center; justify-content: space-between; min-height: 31px; padding: 0 9px 0 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .07em; }
.output-heading-label { display: flex; align-items: center; gap: 12px; }
.output-context { color: var(--faint); font-weight: 400; letter-spacing: 0; }
.output-close { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 3px; background: transparent; color: var(--muted); font-size: 17px; }
.output-close:hover { background: #2a2d2e; color: var(--ink); }
#run-output { flex: 1; min-height: 0; margin: 0; padding: 10px 14px; overflow: auto; background: var(--panel); color: #d4d4d4; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.55 var(--mono); }
.editor-statusbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; padding: 0 9px;
  border-top: 1px solid var(--line); background: #181818; color: var(--muted); font-size: 10px;
}
.status-left, .status-right { display: flex; align-items: center; gap: 12px; min-width: 0; }
.status-item { white-space: nowrap; }
#runtime-status { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--muted); }
#runtime-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #858585; }
#runtime-status[data-state=ready] { color: #b7d7b5; }
#runtime-status[data-state=ready]::before { background: #89d185; }
#runtime-status[data-state=error] { color: #f48771; }
#runtime-status[data-state=error]::before { background: #f48771; }
#notice { min-width: 0; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.linux-runtime { position: fixed; left: -20px; top: 0; width: 4px; height: 4px; overflow: hidden; opacity: .001; pointer-events: none; }
#linux-frame { width: 4px; height: 4px; border: 0; }
@media (max-width: 760px) {
  .topbar { gap: 7px; padding: 0 8px; }
  .brand-context, .editor-toolbar { display: none; }
  .workspace { grid-template-columns: 180px minmax(0, 1fr); }
  .actions { gap: 2px; }
  .button { padding: 4px 7px; }
  .editor-statusbar { gap: 5px; padding: 0 6px; }
  .status-left, .status-right { gap: 7px; }
  #notice { max-width: 32vw; }
}
@media (max-width: 520px) {
  .workspace { grid-template-columns: 142px minmax(0, 1fr); }
  .sidebar-heading { padding-left: 10px; }
  .project-heading { padding-left: 7px; font-size: 10px; }
  .file-row { gap: 3px; padding-left: 6px; font-size: 11px; }
  .file-type-icon { flex-basis: 17px; width: 17px; font-size: 8px; }
  .button.quiet { display: none; }
  .button.primary { min-width: 56px; }
  .editor-tab-main { padding-left: 7px; }
  .status-left .status-optional { display: none; }
  #notice { max-width: 28vw; }
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./index.html" aria-label="WasmBox ターミナルへ戻る">
    <span class="brand-name">WasmBox</span><span class="brand-separator">/</span><span class="brand-context">IDE</span>
  </a>
  <div class="actions">
    <button id="save-button" class="button quiet" type="button" title="Ctrl+S で保存">保存</button>
    <button id="run-button" class="button primary" type="button" disabled><span class="run-glyph" aria-hidden="true">▶</span>実行</button>
    <button id="stop-button" class="button danger" type="button" hidden>停止</button>
    <details id="project-menu" class="project-menu">
      <summary aria-label="プロジェクト操作" title="プロジェクト操作">⋯</summary>
      <div class="project-menu-panel">
        <button id="import-project-button" class="menu-item" type="button">JSON を読み込む…</button>
        <button id="export-project-button" class="menu-item" type="button">JSON を書き出す…</button>
        <input id="import-project-input" type="file" accept="application/json,.json" hidden>
      </div>
    </details>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar" aria-label="プロジェクト">
    <div class="sidebar-heading"><span>エクスプローラー</span><button id="new-file-button" class="icon-button" type="button" aria-label="新しいファイル" title="新しいファイル">＋</button></div>
    <div class="project-heading"><span class="project-caret" aria-hidden="true">▾</span><span>WASMBOX</span></div>
    <div id="file-tree" role="list" aria-label="ファイル一覧"></div>
    <form id="new-file-form" hidden>
      <input id="new-file-name" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="main.py" aria-label="新しいファイル名" required>
      <div class="new-file-actions"><button class="button primary" type="submit">作成</button><button id="new-file-cancel" class="button" type="button">取消</button></div>
      <div id="new-file-error" role="status"></div>
    </form>
  </aside>
  <main class="editor-panel" aria-label="コードエディタ">
    <div class="editor-tabbar">
      <div id="open-tabs" class="open-tabs" role="tablist" aria-label="開いているファイル"></div>
      <div class="editor-tab-spacer"></div>
      <div class="editor-toolbar"><span id="language-label">Python 3</span></div>
    </div>
    <div class="editor-body" id="editor-body" data-editor-engine="loading">
      <pre id="line-numbers" aria-hidden="true">1</pre>
      <div class="editor-surface">
        <textarea id="code-editor" aria-label="ソースコード" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" disabled></textarea>
        <div id="code-editor-cm" class="cm-host" hidden></div>
      </div>
    </div>
    <section id="run-output-panel" class="output-panel" aria-label="実行結果" hidden>
      <div class="output-heading">
        <div class="output-heading-label"><span>OUTPUT</span><span id="output-file-label" class="output-context">実行結果</span></div>
        <button id="output-close-button" class="output-close" type="button" aria-label="出力パネルを閉じる" title="閉じる">×</button>
      </div>
      <pre id="run-output" aria-live="polite"></pre>
    </section>
    <div class="editor-statusbar">
      <div class="status-left">
        <span id="runtime-status" class="status-item" data-state="booting">Linux を起動中…</span>
        <span class="status-item status-optional">UTF-8</span>
        <span class="status-item status-optional">LF</span>
        <span class="status-item status-optional">Spaces: 2</span>
      </div>
      <div class="status-right">
        <span id="project-save-label" data-save="saved" role="status" title="自動保存の状態">●</span>
        <span id="notice" role="status" aria-live="polite">Linux を起動しています。</span>
        <span class="status-item status-optional">WasmBox</span>
      </div>
    </div>
  </main>
</div>
<div class="linux-runtime" aria-hidden="true"><iframe id="linux-frame" src="./index.html?smoke=1" title="WasmBox Linux runtime"></iframe></div>
<script type="module" src="./ide.js"></script>
</body>
</html>
