<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WasmBox IDE</title>
<meta name="description" content="ブラウザ内のLinuxでPythonとNode.jsを実行するサーバーレスIDE">
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--page:#f5f7fb;--surface:#fff;--ink:#172033;--muted:#657087;--line:#dce3ef;--accent:#2459c4;--soft:#eaf1ff;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden;background:var(--page);color:var(--ink);font:14px/1.5 var(--sans)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:31px;height:31px;border-radius:7px;background:var(--soft);color:var(--accent);font-weight:800}.brand-title{font-size:15px;font-weight:750}.brand-subtitle{font-size:11px;color:var(--muted)}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;font-weight:650;white-space:nowrap}.button:hover:not(:disabled){border-color:#a9bce5;background:#f7f9ff}.button.primary{background:var(--accent);border-color:var(--accent);color:white}.button.danger{color:#a52c38}.button.small{min-height:27px;padding:4px 8px;font-size:11px}.status-pill{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;white-space:nowrap}.status-pill[data-state=ready]{background:#edf9f2;border-color:#cdebd8;color:#218454}.status-pill[data-state=error]{background:#fff0f1;border-color:#f0c6ca;color:#c43f48}
.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);flex:1;min-height:0}.sidebar{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);border-right:1px solid var(--line)}.sidebar-heading{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 12px 0 16px;color:var(--muted);border-bottom:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.1em}.icon-button{width:27px;height:27px;border:1px solid transparent;border-radius:5px;background:transparent;color:#42506a;font-size:17px}.icon-button:hover{border-color:var(--line);background:#f8faff}.project-heading{padding:14px 15px 8px;font-size:12px;font-weight:750;color:#26334b}#file-tree{padding:0 7px;overflow:auto}.file-row{display:flex;align-items:center;gap:9px;width:100%;min-height:33px;padding:5px 8px;border:1px solid transparent;border-radius:5px;background:transparent;text-align:left;color:#344158;font-size:12px}.file-row:hover{background:#f5f7fc}.file-row.active{border-color:#dbe6ff;background:var(--soft);color:#17459c}.file-type-icon{display:inline-grid;place-items:center;flex:0 0 23px;width:23px;height:20px;border-radius:4px;font:750 9px var(--mono);background:#edf0f5;color:#5e6c83}.file-type-icon.python{background:#e7f0ff;color:#3566ad}.file-type-icon.javascript{background:#fff3c9;color:#84620a}.file-type-icon.shell{background:#e5f5e9;color:#3b7751}.file-type-icon.json{background:#fff0db;color:#8b531d}.file-type-icon.html{background:#ffebe4;color:#a64b2b}.file-type-icon.css{background:#f0eaff;color:#674cbd}.file-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#new-file-form{display:grid;gap:7px;padding:8px 12px}#new-file-name{width:100%;min-width:0;padding:7px 8px;border:1px solid #b9c9e5;border-radius:5px;background:#fff;font:12px var(--mono)}.new-file-actions{display:flex;gap:5px}.new-file-actions button{flex:1}#new-file-error{color:#c43f48;font-size:11px}.sidebar-footer{margin-top:auto;padding:9px 10px 12px;border-top:1px solid var(--line)}#file-count{margin:0 5px 8px;color:var(--muted);font-size:10px}
.editor-panel{display:flex;flex-direction:column;min-width:0;min-height:0}.editor-tabbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;min-height:43px;padding:0 13px;background:var(--surface);border-bottom:1px solid var(--line)}.active-tab{display:flex;align-items:center;gap:10px;min-width:0;font-size:12px}.active-file{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#project-save-label{color:var(--muted);font-size:10px}#project-save-label[data-save=saved]{color:#218454}#project-save-label[data-save=pending]{color:#a96b08}#project-save-label[data-save=error]{color:#c43f48}.editor-tools{display:flex;align-items:center;gap:6px}.keyboard-hint{color:#8c96a8;font-size:10px}.editor-body{display:grid;grid-template-columns:48px minmax(0,1fr);flex:1;min-width:0;min-height:0;overflow:hidden;background:#fff}#line-numbers{margin:0;padding:15px 10px 24px 0;overflow:hidden;border-right:1px solid #edf0f6;background:#fbfcff;color:#9aa5b7;text-align:right;white-space:pre;user-select:none;font:12px/21px var(--mono)}.editor-surface{position:relative;min-width:0;min-height:0;overflow:hidden}#code-editor{position:absolute;inset:0;display:block;width:100%;height:100%;min-width:0;min-height:0;resize:none;padding:15px 18px 28px;border:0;outline:none;background:#fff;color:#172033;tab-size:2;white-space:pre;overflow:auto;font:12px/21px var(--mono)}.cm-host{position:absolute;inset:0;display:none;min-width:0;min-height:0;overflow:hidden;background:#fff}.cm-host .cm-editor{height:100%;font-size:12px}.cm-host .cm-scroller{overflow:auto;font-family:var(--mono);line-height:21px}.editor-body.cm-ready #line-numbers{display:none}.editor-body.cm-ready #code-editor{display:none}.editor-body.cm-ready .cm-host{display:block}.editor-statusbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;min-height:27px;padding:4px 14px;border-top:1px solid #e8edf5;background:#fbfcff;color:var(--muted);font-size:10px}.editor-status-left,.editor-status-right{display:flex;align-items:center;gap:13px}.bottom-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px;padding:0 12px;border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:10px}#notice{max-width:65vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}.linux-runtime{position:fixed;left:-20px;top:0;width:4px;height:4px;overflow:hidden;opacity:.001;pointer-events:none}#linux-frame{width:4px;height:4px;border:0}
@media(max-width:760px){.topbar{padding:0 8px}.brand-subtitle{display:none}.workspace{grid-template-columns:150px minmax(0,1fr)}.actions{gap:4px}.actions .button{padding:5px 7px}.editor-tools .keyboard-hint{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark" aria-hidden="true">W</div><div><div class="brand-title">WasmBox IDE</div><div class="brand-subtitle">ブラウザ内のLinuxでコードを実行</div></div></div>
  <div class="actions">
    <span id="runtime-status" class="status-pill" data-state="booting">Linuxを起動中…</span>
    <button id="import-project-button" class="button" type="button">読み込み</button>
    <input id="import-project-input" type="file" accept="application/json,.json" hidden>
    <button id="export-project-button" class="button" type="button">書き出し</button>
    <button id="save-button" class="button" type="button" title="Ctrl+Sで保存">保存</button>
    <button id="run-button" class="button primary" type="button" disabled>▶ 実行</button>
    <button id="stop-button" class="button danger" type="button" hidden>停止</button>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar" aria-label="プロジェクト">
    <div class="sidebar-heading"><span>エクスプローラー</span><button id="new-file-button" class="icon-button" type="button" aria-label="新しいファイル">＋</button></div>
    <div class="project-heading">プロジェクト</div>
    <div id="file-tree" role="list" aria-label="ファイル一覧"></div>
    <form id="new-file-form" hidden>
      <input id="new-file-name" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="main.py" aria-label="新しいファイル名" required>
      <div class="new-file-actions"><button class="button small primary" type="submit">作成</button><button id="new-file-cancel" class="button small" type="button">取消</button></div>
      <div id="new-file-error" role="status"></div>
    </form>
    <div class="sidebar-footer"><div id="file-count">3 files</div><div class="keyboard-hint">Ctrl+S 保存 · Ctrl+Enter 実行</div></div>
  </aside>
  <main class="editor-panel" aria-label="コードエディタ">
    <div class="editor-tabbar"><div class="active-tab"><span id="active-file-name">main.py</span><span id="project-save-label" data-save="saved" role="status">保存済み</span></div><div class="editor-tools"><span id="language-label" class="keyboard-hint">Python 3</span></div></div>
    <div class="editor-body" id="editor-body" data-editor-engine="textarea"><pre id="line-numbers" aria-hidden="true">1</pre><div class="editor-surface"><textarea id="code-editor" aria-label="ソースコード" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" disabled></textarea><div id="code-editor-cm" class="cm-host" hidden></div></div></div>
    <div class="editor-statusbar"><div class="editor-status-left"><span>UTF-8</span><span>スペース: 2</span></div><div class="editor-status-right"><span class="keyboard-hint">Ctrl+S 保存</span><span class="keyboard-hint">Ctrl+Enter 実行</span></div></div>
  </main>
</div>
<footer class="bottom-bar"><span>保存先: このブラウザのIndexedDB</span><span id="notice" role="status" aria-live="polite">初回はLinuxの起動に時間がかかります。</span></footer>
<div class="linux-runtime" aria-hidden="true"><iframe id="linux-frame" src="./index.html?smoke=1" title="WasmBox Linux runtime"></iframe></div>
<script type="module" src="./ide.js"></script>
</body>
</html>
